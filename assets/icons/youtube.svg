<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="ytRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#C81E1E"/>
    </linearGradient>
    <linearGradient id="ytShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ytShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#6B0A0A" flood-opacity="0.40"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="80" height="80" rx="22"
        fill="url(#ytRed)" filter="url(#ytShadow)"/>
  <rect x="8" y="8" width="80" height="38" rx="22"
        fill="url(#ytShine)"/>
  <!-- Rounded play pill -->
  <rect x="20" y="32" width="56" height="32" rx="10" fill="#ffffff"/>
  <!-- Play triangle -->
  <path d="M42 40 L60 48 L42 56 Z" fill="url(#ytRed)"/>
</svg>