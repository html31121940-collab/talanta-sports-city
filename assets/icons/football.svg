
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7777"/>
      <stop offset=".45" stop-color="#ed101b"/>
      <stop offset="1" stop-color="#85000b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a5ffbf"/>
      <stop offset=".5" stop-color="#00b957"/>
      <stop offset="1" stop-color="#005b32"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff"/>
      <stop offset=".5" stop-color="#c5cbd2"/>
      <stop offset="1" stop-color="#727984"/>
    </linearGradient>
    <radialGradient id="ball" cx="30%" cy="22%" r="85%">
      <stop stop-color="#fff"/>
      <stop offset=".65" stop-color="#e8ebef"/>
      <stop offset="1" stop-color="#9299a4"/>
    </radialGradient>
    <radialGradient id="shine" cx="25%" cy="15%" r="75%">
      <stop stop-color="#fff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="165"/>
    </clipPath>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#444b55"/>
      <stop offset=".4" stop-color="#050608"/>
      <stop offset="1" stop-color="#252a31"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="433" rx="155" ry="19"
           fill="#000" opacity=".35" filter="url(#shadow)"/>

  <!-- Kenyan flag-inspired motion ribbons -->
  <path d="M105 333 C8 222 94 91 243 63
           C329 47 409 83 452 137
           C360 67 248 93 173 161
           C110 220 104 278 105 333Z"
        fill="url(#red)"/>

  <path d="M77 349 C-2 240 73 107 202 74
           C287 52 363 73 415 105
           C303 49 181 111 121 199
           C89 246 83 301 77 349Z"
        fill="url(#silver)" opacity=".95"/>

  <path d="M89 338 C91 423 197 478 305 448
           C363 432 412 394 440 349
           C374 422 275 453 189 412
           C141 389 110 362 89 338Z"
        fill="url(#green)"/>

  <path d="M105 349 C169 423 290 448 389 384"
        fill="none" stroke="#fff" stroke-width="5"
        opacity=".65" stroke-linecap="round"/>

  <!-- Football body -->
  <circle cx="256" cy="256" r="171"
          fill="#080a0d" opacity=".5"
          filter="url(#shadow)"/>

  <circle cx="256" cy="256" r="165"
          fill="url(#ball)"
          stroke="#252a30" stroke-width="9"/>

  <!-- Ball panels -->
  <g clip-path="url(#ballClip)"
     stroke="#171a20" stroke-width="9"
     stroke-linejoin="round">

    <path d="M256 185 L315 228 L293 296
             L219 296 L197 228Z"
          fill="url(#panel)"/>

    <path d="M256 91 L309 109 L328 165
             L315 228 L256 185 L197 228
             L184 165 L203 109Z"
          fill="url(#ball)"/>

    <path d="M91 196 L140 151 L184 165
             L197 228 L138 266 L87 241Z"
          fill="url(#ball)"/>

    <path d="M421 196 L373 151 L328 165
             L315 228 L374 266 L425 241Z"
          fill="url(#ball)"/>

    <path d="M138 266 L197 228 L219 296
             L190 354 L130 350 L88 296Z"
          fill="url(#ball)"/>

    <path d="M374 266 L315 228 L293 296
             L322 354 L382 350 L424 296Z"
          fill="url(#ball)"/>

    <path d="M219 296 L293 296 L322 354
             L296 416 L216 416 L190 354Z"
          fill="url(#panel)"/>

    <path d="M203 109 L256 91 L309 109"
          fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>
  </g>

  <!-- Gloss reflection -->
  <circle cx="256" cy="256" r="165"
          fill="url(#shine)" pointer-events="none"/>

  <path d="M137 164 Q176 100 247 96"
        fill="none" stroke="#fff" stroke-width="8"
        opacity=".55" stroke-linecap="round"/>

  <!-- Metallic outer rim -->
  <circle cx="256" cy="256" r="165"
          fill="none" stroke="url(#silver)"
          stroke-width="5"/>
</svg>
