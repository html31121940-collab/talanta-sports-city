<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F8DFD"/>
      <stop offset="100%" stop-color="#1B4FCF"/>
    </linearGradient>
    <linearGradient id="shieldShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M48 6 L82 18 V44 C82 64 66 80 48 88 C30 80 14 64 14 44 V18 Z"
        fill="url(#shieldGrad)" stroke="#0F3AA8" stroke-width="2.5"
        stroke-linejoin="round" filter="url(#softShadow)"/>
  <!-- Inner border -->
  <path d="M48 14 L74 24 V44 C74 59 62 72 48 79 C34 72 22 59 22 44 V24 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <!-- Shine -->
  <path d="M48 6 L82 18 V44 C82 64 66 80 48 88 Z"
        fill="url(#shieldShine)"/>
  <!-- Tick -->
  <path d="M34 48 L44 58 L64 36"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>