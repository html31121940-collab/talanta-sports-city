<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D7BFF"/>
      <stop offset="100%" stop-color="#1740B5"/>
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9D6F0"/>
      <stop offset="100%" stop-color="#7E93C4"/>
    </linearGradient>
    <linearGradient id="bodyShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0A2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Shackle -->
  <path d="M30 42 V30 C30 16 66 16 66 30 V42"
        fill="none" stroke="url(#shackleGrad)" stroke-width="9"
        stroke-linecap="round"/>
  <!-- Body -->
  <rect x="20" y="42" width="56" height="46" rx="8"
        fill="url(#bodyGrad)" stroke="#0F3AA8" stroke-width="2.5"
        filter="url(#shadow2)"/>
  <!-- Body shine -->
  <rect x="20" y="42" width="56" height="18" rx="8"
        fill="url(#bodyShine)"/>
  <!-- Keyhole -->
  <circle cx="48" cy="62" r="4.5" fill="#0A1E5C"/>
  <path d="M48 66 V76" stroke="#0A1E5C" stroke-width="4" stroke-linecap="round"/>
</svg>